<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Toko Online - Payment DOKU</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #f4f4f4; }
    .container { display: flex; gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 200px; text-align: center; }
    button { background: #e61c24; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    button:hover { background: #cc1017; }
  </style>
</head>
<body>

  <h2>Pilih Barang untuk Dibeli</h2>
  <div class="container">
    <div class="card">
      <h3>Kopi Susu</h3>
      <p>Rp 20.000</p>
      <button onclick="pay(20000, 'Kopi Susu')">Beli</button>
    </div>
    <div class="card">
      <h3>Roti Bakar</h3>
      <p>Rp 15.000</p>
      <button onclick="pay(15000, 'Roti Bakar')">Beli</button>
    </div>
    <div class="card">
      <h3>Nasi Goreng</h3>
      <p>Rp 25.000</p>
      <button onclick="pay(25000, 'Nasi Goreng')">Beli</button>
    </div>
  </div>

  <script>
    async function pay(price, name) {
      try {
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item: { name, price } })
        });
        
        const data = await response.json();
        if (data.payment_url) {
          // Redirect pengguna ke halaman pembayaran DOKU
          window.location.href = data.payment_url;
        } else {
          alert('Gagal memproses pembayaran');
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi');
      }
    }
  </script>
</body>
</html>
