<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko Produk Digital</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { display: flex; gap: 20px; max-width: 900px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; width: 200px; cursor: pointer; transition: 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .price { font-weight: bold; color: #27ae60; margin: 10px 0; }
    
    /* Modal / Popup */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; text-align: center; min-width: 300px; position: relative; }
    .btn-buy { background: #e74c3c; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    .btn-close { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Pilih Produk</h1>
  <div class="container">
    <div class="card" onclick="openModal('Kopi Premium', 25000)">
      <h3>Kopi Premium</h3>
      <p class="price">Rp 25.000</p>
      <p>Klik untuk detail</p>
    </div>
    <div class="card" onclick="openModal('Kaos Polos', 75000)">
      <h3>Kaos Polos</h3>
      <p class="price">Rp 75.000</p>
      <p>Klik untuk detail</p>
    </div>
    <div class="card" onclick="openModal('Sepatu Sneakers', 250000)">
      <h3>Sepatu Sneakers</h3>
      <p class="price">Rp 250.000</p>
      <p>Klik untuk detail</p>
    </div>
  </div>

  <div class="modal-overlay" id="popupModal">
    <div class="modal-content">
      <button class="btn-close" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle">Nama Produk</h2>
      <p id="modalPrice" class="price">Rp 0</p>
      <p>Apakah Anda yakin ingin membeli produk ini?</p>
      <button class="btn-buy" id="buyBtn" onclick="processPayment()">Beli Sekarang</button>
    </div>
  </div>

  <script>
    let selectedProduct = { name: '', price: 0 };

    function openModal(name, price) {
      selectedProduct = { name, price };
      document.getElementById('modalTitle').innerText = name;
      document.getElementById('modalPrice').innerText = 'Rp ' + price.toLocaleString('id-ID');
      document.getElementById('popupModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('popupModal').style.display = 'none';
    }

    async function processPayment() {
      const buyBtn = document.getElementById('buyBtn');
      buyBtn.innerText = 'Memproses...';
      buyBtn.disabled = true;

      try {
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(selectedProduct)
        });

        const data = await response.json();
        if (data.paymentUrl) {
          // Redirect ke halaman DOKU Checkout
          window.location.href = data.paymentUrl;
        } else {
          alert('Gagal memproses pembayaran.');
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan.');
      } finally {
        buyBtn.innerText = 'Beli Sekarang';
        buyBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
